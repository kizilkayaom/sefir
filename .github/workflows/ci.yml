name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check
      - name: Initialize Terraform
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform -chdir=infra validate -no-color

  go:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://sefir:sefir_ci@localhost:5432/sefir_test?sslmode=disable

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: sefir_test
          POSTGRES_USER: sefir
          POSTGRES_PASSWORD: sefir_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sefir -d sefir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.29.0

      - name: Apply test database migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: ${{ env.TEST_DATABASE_URL }}
        run: goose -env=none -dir ../db/migrations up

      - name: Test
        run: go test -race -count=1 -v ./...
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.17"
      - name: Install Python
        run: uv python install
      - name: Sync all locked packages
        run: uv sync --locked --all-packages
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check ruff format
        run: uv run --locked ruff format --check .
      - name: Test Python workflows
        run: uv run --locked --package sefir-agent python -m unittest discover -s worker/tests -v
      - name: Install Temporal CLI
        run: |
          mkdir -p "$RUNNER_TEMP/temporal-bin"
          curl --fail --location --retry 3 https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/temporal.tar.gz"
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  $RUNNER_TEMP/temporal.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/temporal.tar.gz" -C "$RUNNER_TEMP/temporal-bin"
          echo "$RUNNER_TEMP/temporal-bin" >> "$GITHUB_PATH"

      - name: Test Temporal integration
        timeout-minutes: 5
        run: uv run --locked --package sefir-agent python -m unittest discover -s worker/integration_tests -v