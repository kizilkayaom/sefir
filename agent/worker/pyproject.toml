[project]
name = "sefir-agent"
version = "0.1.0"
description = "Sefir agent worker: drafts outreach emails and runs the approval workflow."
license = "Apache-2.0"
authors = [
    { name = "Ömer Kızılkaya" }
]
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.12.0",
    "litellm>=1.84",
    "mcp>=2.3.0",
    "pydantic>=2,<3",
    "temporalio==1.34.0",
]

[project.scripts]
sefir-agent = "sefir_agent.cli:main"
sefir-worker = "sefir_agent.worker:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
